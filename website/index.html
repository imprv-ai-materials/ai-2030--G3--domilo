e własnych budynkach — jak hotel, tylko na rok, a nie na noc.** Operator instytucjonalnego najmu mieszkań (PRS, *private rented sector*): kupuje całe budynki albo pakiety lokali od deweloperów i sam je wynajmuje, obsługuje i utrzymuje.\n\n| | |\n|---|---|\n| Siedziba | Warszawa, ul. Grzybowska (biuro zarządu i centrum obsługi najemców) |\n| Rok założenia | 2017 (pierwszy budynek: Warszawa Wola, 2019) |\n| Zatrudnienie | ok. 310 osób (w tym 11 doradców najmu, 4 rzeczoznawców, 46 osób w dziale technicznym, 80 osób w recepcjach budynków) |\n| Przychód | ok. 220 mln PLN rocznie (ok. 18,3 mln PLN miesięcznie), w 98% z czynszów |\n| Portfel | 7 200 mieszkań w 38 budynkach w 6 miastach, wartość ok. 4,32 mld PLN (średnio 600 000 PLN za lokal) |\n| Finansowanie | kredyt 2,10 mld PLN w Nadwiślańskim Banku Hipotecznym; kowenant LTV ≤ 55%, dziś 48,6% |\n| Obłożenie | 95% (ok. 6 830 zajętych lokali) |\n| Średni czynsz | 2 550 PLN miesięcznie dla umów rocznych (B2C i B2B łącznie) |\n\n**Model biznesowy.** Domilo zarabia na różnicy między czynszem a kosztem kapitału i utrzymania budynku. Pieniądze tracą trzy rzeczy: pusty lokal (każdy dzień to ok. 84 PLN czynszu), rotacja najemców (odświeżenie lokalu, prezentacje, prowizje portali) i awarie (pilne naprawy, obniżki czynszu, skargi). Czwarta rzecz to wartość portfela: od niej zależy kowenant bankowy, a więc koszt i dostępność kredytu na kolejne zakupy.\n\n### Linie biznesowe\n\n| Linia | Udział w przychodzie | Skala |\n|---|---|---|\n| Najem indywidualny (B2C) | 68% | 5 300 lokali, obłożenie 96%, średnio 2 450 PLN/mies., umowa roczna z opcją przedłużenia |\n| Najem korporacyjny (B2B, relokacje) | 20% | 1 300 lokali, obłożenie 95%, średnio 2 950 PLN/mies. (umeblowane), ok. 420 firm-klientów, umowy ramowe z 3 dużymi pracodawcami od 2025-06 |\n| Najem średnioterminowy (1–6 mies.) | 10% | 600 lokali, obłożenie 85%, średnio 3 700 PLN/mies., średnio 4,5 mies. pobytu |\n| Usługi dodatkowe | 2% | parkingi, komórki lokatorskie, sprzątanie, pakiety meblowe — ok. 4 mln PLN rocznie |\n\nRachunek: 5 088 × 2 450 × 12 = 149,6 mln + 1 235 × 2 950 × 12 = 43,7 mln + 510 × 3 700 × 12 = 22,6 mln + usługi 4,1 mln ≈ **220 mln PLN**.\n\n### Budynki i infrastruktura\n\n| Miasto | Budynki | Lokale | Windy | Ogrzewanie |\n|---|---|---|---|---|\n| Warszawa | 14 | 2 900 | 52 | 11 węzłów cieplnych, 3 budynki z pompami ciepła |\n| Kraków | 7 | 1 300 | 26 | 6 węzłów, 1 budynek z pompami |\n| Wrocław | 6 | 1 100 | 22 | 4 węzły, 2 budynki z pompami (w tym Kępa Park, 2024) |\n| Poznań | 4 | 700 | 14 | 4 węzły |\n| Gdańsk | 4 | 650 | 15 | 2 węzły, 2 budynki z pompami (w tym Stocznia Park, 2024) |\n| Łódź | 3 | 550 | 11 | 2 węzły, 1 budynek z pompami |\n| **Razem** | **38** | **7 200** | **140** | **29 budynków z węzłami (31 węzłów), 9 budynków z pompami (46 pomp)** |\n\nWindy pochodzą od czterech producentów: Dźwigmet (46), Liftar (38), Vertica (34), Elmont (22). Konserwację ustawową (co 30 dni) robią dwie zewnętrzne firmy serwisowe; dział techniczny Domilo koordynuje zgłoszenia i odbiera prace.\n\n---\n\n## 2. Systemy IT — skąd pochodzą dane\n\n| System | Co wie | Czego nie wie |\n|---|---|---|\n| **PMS „Kwatera\"** (zarządzanie najmem) | Budynki, lokale, najemcy, najmy i okresy umów, czynsze, indeksacje przy przedłużeniu, płatności. Historia najmów od 2017 (migracja do Kwatery w 2023-03). | Skąd przyszedł najemca (przed 2023-03 pole puste), dlaczego odszedł (pole „powód\" wypełnione w 34% przypadków), ile lokal jest wart. |\n| **CRM „Lejek\"** (sprzedaż najmu) | Zapytania (leady) ze wszystkich kanałów, aktywności doradców (telefony, e-maile, prezentacje), statusy, firmy B2B. Historia od 2023-01 (migracja z poprzedniego CRM w 2025-03). | Czy lead nieobsłużony był dobry — wie tylko, czy podpisał umowę. Nie wie, czym kierował się doradca, wybierając kogo zadzwonić. |\n| **Portal najemcy „Mój Domilo\"** (aplikacja i strona) | Zgłoszenia najemców, wiadomości (tekst), logowania, ankiety satysfakcji, ofertę przedłużenia, którą najemca zobaczył. | Czy najemca szuka już innego mieszkania. Nastrój najemcy zna tylko z treści wiadomości. |\n| **„Serwisownik\"** (system zgłoszeń technicznych, CMMS) | Zgłoszenia usterek, zlecenia dla firm serwisowych, konserwacje i przeglądy, notatki konserwatorów (wolny tekst). | Kiedy awaria naprawdę się zaczęła (zgłoszenie powstaje, gdy ktoś zadzwoni). Pole „kategoria\" wypełniane niechlujnie — tylko 39% awarii wind ma kategorię „awaria\". |\n| **Telemetria „Telemetra\"** (IoT budynków) | Sterowniki wind co 10 minut: kursy, drzwi, prąd silnika, temperatura, wibracje, kody błędów. Węzły cieplne i pompy ciepła co 15 minut. | Że coś się zepsuło — widzi tylko sygnały. Nie zna historii napraw ani wymienionych części. Czujniki wibracji dopiero od 2024-05 (część wind od 2025-01). |\n| **„Radar Ofert\"** (narzędzie działu inwestycji) | Ogłoszenia sprzedaży z portali i pakiety deweloperów (cena ofertowa, opis, zdjęcia), transakcje z rejestru cen nieruchomości (z ok. 3-miesięcznym opóźnieniem), operaty szacunkowe lokali Domilo. | Za ile oferta naprawdę się sprzedała, jeśli nie trafiła do rejestru. W opisie ogłoszenia często jest cena — system tego nie oznacza. |\n| **ERP „FinKs\"** (finanse i księgowość) | Koszty napraw i serwisu, rabaty retencyjne zaksięgowane jako obniżki czynszu, koszty pozyskania najemców, koszt operatów. | Którego najemcy dotyczy koszt pustostanu — zna tylko kwoty na poziomie budynku i miesiąca. |\n| Dane zewnętrzne | OpenStreetMap (przystanki, stacje metra, parki, szkoły, sklepy), statystyki GUS dla dzielnic. | Niczego o konkretnym lokalu. |\n\n---", "ludzie": [{"slug": "natalia-grabowska", "imie": "Natalia", "nazwisko": "Grabowska", "rola": "Analityczka danych, jedyna osoba od ML w firmie", "dzial": "Zarząd - zespół danych", "cytat": "Zebrałam wszystkie zgłoszenia przy windach z Serwisownika i ułożyłam je według kategorii.", "cechy": ["uważna i ciekawa danych", "mówi tylko liczbami, które policzyła"], "chce": "Modele, które ktoś faktycznie używa.", "mowi": "W pierwszej osobie, spokojnie, krok po kroku („Policzyłam…”, „Zebrałam…”); każda liczba z danych.", "bio": "Natalia jest analityczką danych i jedyną osobą od uczenia maszynowego w Domilo. Przyszła z firmy fintechowej, gdzie budowała scoring; tu każdy dział chce „AI”, a nikt nie mówi, co zrobi z wynikiem.\n\n\nJest uważna i ciekawa; najlepiej czuje się wtedy, gdy zauważy w danych coś dziwnego — skok błędów drzwi po aktualizacji firmware'u, migrację CRM, po której zmienia się źródło zapytań.", "img": "img/natalia-grabowska.jpg"}, {"slug": "monika-lis", "imie": "Monika", "nazwisko": "Lis", "rola": "Dyrektor finansowa (CFO)", "dzial": "Finanse", "cytat": "Tego sporu dziś nie rozstrzygniemy. Ustalmy za to, co możemy: kolejność projektów, koszty i dostęp do danych.", "cechy": ["analityczna, pyta o liczbę i jej źródło", "prowadzi spotkania zarządu i zamyka spory decyzją", "patrzy na bank i kowenant"], "chce": "Spokojny kowenant LTV i koszty, które da się obronić.", "mowi": "Spokojnie i rzeczowo; porządkuje dyskusję („Ustalmy za to, co możemy…”), mówi kwotami w złotych.", "bio": "Monika jest dyrektorką finansową Domilo od 2020 roku; wcześniej pracowała w banku przy finansowaniu nieruchomości komercyjnych, więc umowę kredytową z Nadwiślańskim Bankiem Hipotecznym zna z obu stron stołu.\n\nPilnuje dwóch rzeczy: kowenantu LTV i kosztów, które da się obronić przed zarządem. Płaci 3,24 mln PLN rocznie za operaty zewnętrzne, a od kwietnia 2026 bank chce ich cztery razy więcej. Widzi też w finansach rosnące rabaty retencyjne — i nie widzi zysku, który miałyby przynosić.\n\nJest właścicielką większości stałych ekonomicznych kursu: kosztu dnia pustostanu, kosztu odejścia najemcy, ceny operatu. Na spotkaniach porządkuje dyskusję i zamyka spory decyzją: „Tego sporu dziś nie rozstrzygniemy. Ustalmy za to, co możemy.” Kolejność projektów — najpierw wycena, bo bank wyznaczył termin — ogłasza ona.", "img": "img/monika-lis.jpg"}, {"slug": "pawel-zielinski", "imie": "Paweł", "nazwisko": "Zieliński", "rola": "Dyrektor inwestycji", "dzial": "Inwestycje", "cytat": "Radar pokazuje czterdzieści siedem tysięcy ofert rocznie. Ewa z zespołem wycenia osiem dziennie na osobę. Resztę oceniamy na oko — albo wcale.", "cechy": ["decyduje szybko i nie lubi czekać", "myśli rynkiem, nie portfelem", "chce jednej liczby, nie przedziału", "naciska, ale przyjmuje argument z danych"], "chce": "Kupować tanio i szybko, zanim ofertę zgarnie konkurencja.", "mowi": "Krótkie, stanowcze zdania; zaczyna od problemu („Mój problem jest prosty…”); mówi do Natalii po imieniu i stawia żądania („Daj mi model, który wyceni wszystko”).", "bio": "Paweł przyszedł do Domilo w 2018 roku z działu inwestycji dużego dewelopera, jeszcze zanim spółka kupiła pierwszy budynek na Woli. To on wynegocjował większość pakietów lokali, z których zbudowano dzisiejszy portfel, i to on pierwszy pokazał zarządowi Katowice.\n\nMyśli rynkiem, nie portfelem: rano przegląda Radar Ofert, po południu dzwoni do deweloperów. Wie, że dobra oferta znika w kilka dni, a jego zespół zdąży rzetelnie obejrzeć co siódmą. Dlatego chce modelu, który „wyceni wszystko” — każdą ofertę, każdy lokal, codziennie — i najchętniej jednej liczby, a nie przedziału.\n\nNa spotkaniach naciska i bywa niecierpliwy, ale przyjmuje argument z danych. Gdy Ewa mówi, że liczba dla Katowic bez transakcji to zgadywanie, nie obraża się — prosi o regułę, która powie, kiedy model ma milczeć.", "img": "img/pawel-zielinski.jpg"}, {"slug": "ewa-kaminska", "imie": "Ewa", "nazwisko": "Kamińska", "rola": "Główna rzeczoznawczyni (zespół 4 osób)", "dzial": "Inwestycje - wyceny", "cytat": "Liczba dla Katowic bez ani jednej transakcji to zgadywanie z dwoma miejscami po przecinku. Precyzyjny format nie dodaje wiedzy.", "cechy": ["precyzyjna i sceptyczna wobec automatów", "broni prawa do odpowiedzi „nie wiem”", "zgadza się na model, jeśli dostaje kolejkę trudnych przypadków", "pilnuje, żeby uzasadnienie było zdaniem dla człowieka"], "chce": "Wyceniać to, na czym naprawdę zna się człowiek.", "mowi": "Spokojna, rzeczowa, z puentą; stawia warunki do specyfikacji („To wpiszcie do specyfikacji panelu”).", "bio": "Ewa jest rzeczoznawczynią od ponad dwudziestu lat; w Domilo kieruje czteroosobowym zespołem wycen. Zna rynek warszawskich i krakowskich mieszkań z operatów, które sama podpisywała, i nie ufa liczbom bez pochodzenia.\n\nJej dzień to osiem wycen, w większości „oczywistych”. Od kwietnia 2026 bank chce rewaluacji portfela co kwartał — tego zespół nie udźwignie bez automatu. Ewa nie broni się przed modelem; broni prawa do odpowiedzi „nie wiem”. Zgadza się na wycenę automatyczną, jeśli trudne przypadki — nowe miasto, nietypowy lokal, loft, Stocznia — trafią do niej z jednym zdaniem uzasadnienia, a nie z samym wynikiem liczbowym.\n\nMówi spokojnie i krótko, a swoje warunki dyktuje do specyfikacji. To ona przypomina Pawłowi, że precyzyjny format nie dodaje wiedzy.", "img": "img/ewa-kaminska.jpg"}, {"slug": "rafal-dabrowski", "imie": "Rafał", "nazwisko": "Dąbrowski", "rola": "Kierownik zespołu najmu (11 doradców)", "dzial": "Sprzedaż najmu", "cytat": "Doradcy dzwonią od najnowszego zapytania. Wiem, że cztery z pięciu rozmów to strata czasu, ale nie wiem, które to są.", "cechy": ["energiczny, praktyczny, trochę niecierpliwy", "liczy w umowach i godzinach doradców", "broni autonomii swoich ludzi", "chce wyniku na tablicy zespołu, nie raportu"], "chce": "Więcej podpisanych umów bez nowych etatów.", "mowi": "Bezpośrednio, od tego, czego nie potrzebuje („Zacznę od tego, czego nie potrzebuję: więcej ludzi”).", "bio": "Rafał prowadzi zespół jedenastu doradców najmu. Sam zaczynał jako doradca w Warszawie i do dziś pamięta, jak dzwonił „od najnowszego” — bo tak robili wszyscy.\n\nChce więcej podpisanych umów bez nowych etatów i mówi to na każdym spotkaniu, zanim ktokolwiek zaproponuje rekrutację. Wie, że cztery z pięciu pierwszych rozmów to strata czasu, ale nie wie, które. Każdy doradca wybiera sam: ma ulubione źródła zapytań i dzwoni od najnowszego.\n\nJest energiczny i praktyczny, trochę niecierpliwy. Liczy w umowach i w godzinach doradców; jego miarą jest przychód z podpisanych umów na godzinę pracy zespołu. Broni autonomii swoich ludzi — dlatego zgadza się na kolejkę, w której doradca może pominąć pozycję z powodem.", "img": "img/rafal-dabrowski.jpg"}, {"slug": "kasia-nowak", "imie": "Kasia", "nazwisko": "Nowak", "rola": "Doradczyni najmu, Warszawa", "dzial": "Sprzedaż najmu", "cytat": "Rafał, ja znam ludzi, których model nie zna. Model tego nie wie, a ja tak.", "cechy": ["życzliwa, zmęczona długą listą telefonów", "ufa swojej wiedzy o klientach", "przyjmuje kolejkę, jeśli może pominąć pozycję z powodem", "mówi w imieniu doradców z pierwszej linii"], "chce": "Wiedzieć rano, do kogo dzwonić najpierw — i dlaczego.", "mowi": "Prosto i konkretnie, z perspektywy własnej zmiany („U mnie zmiana zaczyna się rano”).", "bio": "Kasia jest doradczynią najmu w Warszawie od trzech lat. Zaczyna dzień od listy około trzech tysięcy otwartych zapytań, posortowanej tylko po dacie, i od słuchawek na szyi.\n\nZna klientów, których model nie zna: firmę, która zawsze rezygnuje w ostatniej chwili, osoby, które podpisały już umowę gdzie indziej. Dlatego na kolejkę patrzy z ostrożnością — i dlatego to ona wymyśla zasadę pominięcia: jedno kliknięcie i jeden z czterech powodów. „Tę zasadę biorę na siebie, bo to ja będę ją stosować.”\n\nPo wdrożeniu mówi wprost: lista jest dobra, w większości zgadza się z tym, co sama by wybrała, a przy każdym zapytaniu ma jedno zdanie uzasadnienia. Przestała dzwonić od najnowszego.", "img": "img/kasia-nowak.jpg"}, {"slug": "joanna-michalak", "imie": "Joanna", "nazwisko": "Michalak", "rola": "Dyrektorka obsługi najemców i retencji", "dzial": "Obsługa najemców", "cytat": "Marketing mówi, że retencja wzrosła o sześć punktów. Monika mówi, że rabaty kosztują dwa miliony rocznie. Obie liczby są prawdziwe i nie wiem, co z tym zrobić.", "cechy": ["ciepła, ale stanowcza", "broni najemców i swojego budżetu rabatów", "chce wiedzieć, ilu najemców zostałoby bez rabatu", "otwiera spotkania od tego, jak jest dziś"], "chce": "Mniej odejść przy końcu umowy.", "mowi": "Ciepło, porządkując fakty („Zacznę od tego, jak to dziś działa”); wraca do jednego pytania, aż dostanie odpowiedź.", "bio": "Joanna kieruje obsługą najemców i retencją od otwarcia pierwszych budynków. Jej ludzie siedzą w recepcjach i w portalu „Mój Domilo”; to do nich trafiają skargi po awarii windy i pytania o przedłużenie umowy.\n\nOd lutego 2024 roku prowadzi politykę rabatową: zewnętrzny dostawca ocenia ryzyko odejścia, a 35% najemców z najwyższym wynikiem dostaje rabat. Marketing raportuje wzrost retencji, finanse — dwa miliony złotych rabatów rocznie. Obie liczby są prawdziwe i Joanna nie wie, co z nimi zrobić.\n\nJest ciepła, ale stanowcza. Broni najemców i swojego budżetu, a na spotkaniach wraca do jednego pytania, aż dostanie odpowiedź: ilu najemców z rabatem zostałoby i bez niego.", "img": "img/joanna-michalak.jpg"}, {"slug": "bartek-sowa", "imie": "Bartek", "nazwisko": "Sowa", "rola": "Specjalista CRM i kampanii", "dzial": "Obsługa najemców - marketing", "cytat": "Moniko, ci najemcy bez oferty to też koszt. Część z nich to przekonywalni, którzy bez rabatu po prostu odejdą.", "cechy": ["entuzjasta kampanii", "trochę niepewny przy liczbach, które mu nie sprzyjają", "chce zmniejszyć grupę kontrolną", "szybko się uczy"], "chce": "Kampania, której wynik da się pokazać w złotówkach.", "mowi": "Żywo, „zacznę od liczb”; dopytuje („Czyli przedłużeń jest więcej, a kampania i tak jest na minusie?”).", "bio": "Bartek odpowiada w dziale Joanny za CRM i kampanie. Przyszedł z agencji marketingowej, lubi panele i wykresy, a najbardziej — kampanię, której wynik da się pokazać w złotówkach.\n\nGdy wynik kampanii Q3 wychodzi na minusie mimo większej liczby przedłużeń, dopytuje z niedowierzaniem — i szybko się uczy. Grupę kontrolną chce zmniejszyć, bo każdy najemca w kontroli to dla niego stracona oferta; Monika i Natalia tłumaczą mu, czemu to zły pomysł.\n\nMówi żywo i zaczyna od liczb, czasem zbyt pewnie.", "img": "img/bartek-sowa.jpg"}, {"slug": "marek-wojciechowski", "imie": "Marek", "nazwisko": "Wojciechowski", "rola": "Kierownik działu technicznego", "dzial": "Dział techniczny (46 osób)", "cytat": "Awaria windy w piątek o osiemnastej to telefony do recepcji, obniżki czynszu i serwis z dopłatą za tryb pilny.", "cechy": ["praktyk, zmęczony awariami", "podpisuje koszt awarii i bierze za niego odpowiedzialność", "zostawia próg alarmów ludziom, nie metryce", "ufa Zbyszkowi"], "chce": "Planować naprawy zamiast gasić pożary.", "mowi": "Obrazowo i konkretnie, od sytuacji z budynku („A u mnie winda staje w piątek o osiemnastej”).", "bio": "Marek kieruje 46-osobowym działem technicznym. Wcześniej przez lata prowadził utrzymanie ruchu w dużej spółdzielni mieszkaniowej; zna budynki od piwnicy po dach.\n\nJego zmora to awaria windy w piątek o osiemnastej: telefony do recepcji, obniżki czynszu, serwis z dopłatą za tryb pilny. Zleca przeglądy dodatkowe „na wszelki wypadek”, a windy i tak stają. Chce planować naprawy zamiast gasić pożary.\n\nPodpisuje się pod kosztem awarii i mówi, z czego się składa: dopłata i obniżki są w FinKs i w PMS, skargi to jego szacunek. Próg alarmów zostawia ludziom, nie metryce — „i będzie to raczej Zbyszek niż ja”.", "img": "img/marek-wojciechowski.jpg"}, {"slug": "zbigniew-kowalczyk", "imie": "Zbigniew", "nazwisko": "Kowalczyk", "rola": "Koordynator konserwatorów, 22 lata przy windach", "dzial": "Dział techniczny", "cytat": "Kategorię wybiera człowiek w pośpiechu. Awarię wpisuję jako interwencję, bo tak szybciej zamykam zlecenie.", "cechy": ["mądry, sceptyczny, z półuśmiechem", "zna każdą windę z nazwy budynku", "pilnuje złotego zbioru i kosztu wizyty", "liczy alarmy, które jego dział przeczyta"], "chce": "Żeby system nie zasypywał go fałszywymi alarmami.", "mowi": "Spokojnie, po swojemu, bez żargonu; przyznaje się do skrótów, które psują dane.", "bio": "Zbigniew Kowalczyk — dla wszystkich „Zbyszek” — od 22 lat pracuje przy windach, w Domilo koordynuje konserwatorów obu zewnętrznych firm serwisowych. Zna każdą windę po nazwie budynku i po dźwięku drzwi.\n\nHistoria awarii jest w jego notatkach w Serwisowniku, nie w bazie: kategorię zgłoszenia wybiera człowiek w pośpiechu, a on sam wpisuje awarię jako interwencję, bo tak szybciej zamyka zlecenie. Przyznaje się do tego bez skrępowania — i dlatego to on pilnuje złotego zbioru zgłoszeń oznaczonych ręcznie.\n\nJest sceptyczny wobec alarmów z systemu: „trzy zbędne alarmy w tygodniu i przestaję czytać”. Dla niego najważniejsze jest, ile alarmów tygodniowo jego dział naprawdę przeczyta.", "img": "img/zbigniew-kowalczyk.jpg"}], "historia": [{"data": "2017", "zdarzenie": "Założenie spółki"}, {"data": "2019-04", "zdarzenie": "Pierwszy budynek, Warszawa Wola"}, {"data": "2021–2022", "zdarzenie": "Wejście do Krakowa, Wrocławia, Poznania i Gdańska"}, {"data": "2023-01", "zdarzenie": "Trzy budynki w Łodzi"}, {"data": "2023-03", "zdarzenie": "Migracja PMS do „Kwatery\""}, {"data": "2023", "zdarzenie": "Ceny mieszkań rosną ok. 0,6% miesięcznie"}, {"data": "2024-02", "zdarzenie": "Polityka retencyjna: rabat 1 800 PLN dla 35% najbardziej „ryzykownych\""}, {"data": "2024-05", "zdarzenie": "Czujniki wibracji w 96 windach"}, {"data": "2024-07 – 2025-06", "zdarzenie": "Ceny mieszkań płasko"}, {"data": "2024-09", "zdarzenie": "Otwarcie Kępa Park (Wrocław, 290 lokali, 5 wind) i Stocznia Park (Gdańsk, 230 lokali, 6 wind)"}, {"data": "2025-01", "zdarzenie": "Czujniki wibracji we wszystkich 140 windach"}, {"data": "2025-03-03 – 2025-04-13", "zdarzenie": "Migracja CRM do „Lejka\": zewnętrzne call center dzwoni do wszystkich zapytań po kolei, w 24 h"}, {"data": "2025-06", "zdarzenie": "Umowy ramowe z trzema pracodawcami (Altakom, Vistel, Medikar) na relokacje"}, {"data": "2025-07 – 2026-03", "zdarzenie": "Losowy test rabatu: kontroling wymusza losowanie 50/50 oferty rabatu wśród wszystkich kończących się umów"}, {"data": "2025-07 →", "zdarzenie": "Ceny mieszkań rosną ok. 0,3% miesięcznie"}, {"data": "2025-11-17", "zdarzenie": "Aktualizacja firmware sterowników Liftar: kod E07 rozdzielony na E07 i E17"}, {"data": "2026-01", "zdarzenie": "Zarząd rozważa wejście do Katowic"}, {"data": "2026-04", "zdarzenie": "Bank wymaga rewaluacji kwartalnej; zgoda na AVM od 2027-Q1 po spełnieniu warunków"}, {"data": "2026-04 – 2026-09", "zdarzenie": "Polityka retencyjna wraca (stara reguła 35%)"}, {"data": "2026-06 →", "zdarzenie": "Pierwsze oferty z Katowic w Radarze Ofert; 2026-08 pakiet dewelopera „Osiedle Szyb\", 180 lokali"}, {"data": "2026-07 – 2026-09", "zdarzenie": "Kampania retencyjna Q3 według starej reguły, z 20% losową grupą kontrolną (warunek kontrolingu po teście)"}, {"data": "2026-09", "zdarzenie": "Ostatni operat kontrolny: 300 lokali wycenionych przez zewnętrznego rzeczoznawcę"}], "inicjatywy": [{"id": "B1", "nazwa": "Wycena", "wlasciciel": "pawel-zielinski", "cytat": "Radar pokazuje czterdzieści siedem tysięcy ofert rocznie. Ewa z zespołem wycenia osiem dziennie na osobę. Resztę oceniamy na oko — albo wcale.", "kto": "Paweł Zieliński, dyrektor inwestycji", "opis": "Model, który co noc wycenia oferty z Radaru i cały portfel Domilo: cena z przedziałem niepewności i uczciwe „nie wiem” tam, gdzie dane nie wystarczają. Rzeczoznawcy dostają tylko trudne przypadki, a bank wycenę co kwartał.", "art": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Wycena lokalu z przedziałem\">\n<rect class=\"s\" x=\"0\" y=\"0\" width=\"320\" height=\"180\"/>\n<g class=\"k\" fill=\"none\" stroke-width=\"2\">\n<path d=\"M40 150 V70 L85 42 L130 70 V150 Z\"/><path d=\"M28 150 H300\"/>\n<rect x=\"56\" y=\"82\" width=\"18\" height=\"18\"/><rect x=\"96\" y=\"82\" width=\"18\" height=\"18\"/><rect x=\"56\" y=\"112\" width=\"18\" height=\"18\"/><rect x=\"96\" y=\"112\" width=\"18\" height=\"18\"/>\n<\/g>\n<rect class=\"w k\" x=\"160\" Color\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z\"/><\/svg>"}, {"nazwa": "Telemetra (IoT)", "co": "Lift controllers every 10 min, heat substations and heat pumps every 15 min", "folder": "telemetra", "ikona_svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"/><\/svg>"}, {"nazwa": "Radar Ofert", "co": "Property listings, developer packages, transaction register, valuation reports, photos", "folder": "radar", "ikona_svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.3-4.3\"/><\/svg>"}, {"nazwa": "“FinKs” ERP", "co": "Maintenance costs, discounts, tenant turnover costs", "folder": "fk", "ikona_svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z\"/><path d=\"M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11\"/><\/svg>"}, {"nazwa": "External data", "co": "Map points of interest, Statistics Poland (GUS) district statistics", "folder": "zewnetrzne", "ikona_svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20\"/><\/svg>"}], "wstep": "Domilo is a fictional company where the whole course takes place. On this site you will meet its people, buildings, systems and data. In the course you will build four machine learning projects for Domilo, each from the first line of code to deployment.", "profil": "## 1. Who Domilo is\n\n**Domilo S.A. rents out flats on long-term leases in buildings it owns — like a hotel, only by the year rather than by the night.** It is an institutional residential landlord (PRS, *private rented sector*): it buys whole buildings or packages of units from developers, and lets, runs and maintains them itself.\n\n| | |\n|---|---|\n| Headquarters | Warsaw, Grzybowska Street (Management Board office and tenant service centre) |\n| Founded | 2017 (first building: Warsaw Wola, 2019) |\n| Employees | approx. 310 (including 11 leasing consultants, 4 valuers, 46 people in the technical department and 80 building receptionists) |\n| Revenue | approx. PLN 220 m a year (approx. PLN 18.3 m a month), 98% of it from rent |\n| Portfolio | 7,200 flats in 38 buildings across 6 cities, valued at approx. PLN 4.32 bn (PLN 600,000 per unit on average) |\n| Financing | PLN 2.10 bn loan from Nadwiślański Bank Hipoteczny; LTV covenant ≤ 55%, currently 48.6% |\n| Occupancy | 95% (approx. 6,830 occupied units) |\n| Average rent | PLN 2,550 a month on annual contracts (B2C and B2B combined) |\n\n**Business model.** Domilo earns the spread between rent and the cost of capital and building upkeep. Three things lose money: an empty unit (each day costs approx. PLN 84 in lost rent), tenant turnover (refreshing the unit, viewings, portal commissions) and breakdowns (urgent repairs, rent reductions, complaints). The fourth factor is the value of the portfolio: the bank covenant depends on it, and with it the cost and availability of credit for further acquisitions.\n\n### Business lines\n\n| Line | Share of revenue | Scale |\n|---|---|---|\n| Individual lettings (B2C) | 68% | 5,300 units, 96% occupancy, PLN 2,450/month on average, annual contract with an option to extend |\n| Corporate lettings (B2B, relocations) | 20% | 1,300 units, 95% occupancy, PLN 2,950/month on average (furnished), approx. 420 client companies, framework agreements with 3 major employers since 2025-06 |\n| Mid-term lettings (1–6 months) | 10% | 600 units, 85% occupancy, PLN 3,700/month on average, average stay of 4.5 months |\n| Additional services | 2% | parking spaces, storage units, cleaning, furniture packages — approx. PLN 4 m a year |\n\nCalculation: 5,088 × 2,450 × 12 = 149.6 m + 1,235 × 2,950 × 12 = 43.7 m + 510 × 3,700 × 12 = 22.6 m + services 4.1 m ≈ **PLN 220 m**.\n\n### Buildings and infrastructure\n\n| City | Buildings | Units | Lifts | Heating |\n|---|---|---|---|---|\n| Warsaw | 14 | 2,900 | 52 | 11 heat substations, 3 buildings with heat pumps |\n| Kraków | 7 | 1,300 | 26 | 6 substations, 1 building with heat pumps |\n| Wrocław | 6 | 1,100 | 22 | 4 substations, 2 buildings with heat pumps (including Kępa Park, 2024) |\n| Poznań | 4 | 700 | 14 | 4 substations |\n| Gdańsk | 4 | 650 | 15 | 2 substations, 2 buildings with heat pumps (including Stocznia Park, 2024) |\n| Łódź | 3 | 550 | 11 | 2 substations, 1 building with heat pumps |\n| **Total** | **38** | **7,200** | **140** | **29 buildings with substations (31 substations), 9 buildings with heat pumps (46 pumps)** |\n\nThe lifts come from four manufacturers: Dźwigmet (46), Liftar (38), Vertica (34) and Elmont (22). Statutory maintenance (every 30 days) is carried out by two external service companies; Domilo's technical department coordinates the tickets and signs off the work.\n\n---\n\n## 2. IT systems — where the data comes from\n\n| System | What it knows | What it doesn't know |\n|---|---|---|\n| **“Kwatera” PMS** (lease management) | Buildings, units, tenants, tenancies and contract periods, rents, indexation on renewal, payments. Tenancy history from 2017 (migrated to Kwatera in 2023-03). | Where a tenant came from (the field is empty before 2023-03), why they left (the “reason” field is filled in for 34% of cases), what a unit is worth. |\n| **“Lejek” CRM** (leasing sales) | Enquiries (leads) from all channels, leasing consultants' activities (calls, e-mails, viewings), statuses, B2B companies. History from 2023-01 (migrated from the previous CRM in 2025-03). | Whether an enquiry nobody followed up was a good one — it only knows whether a contract was signed. It doesn't know what guided a consultant when choosing whom to call. |\n| **“Mój Domilo” tenant portal** (app and website) | Tenant requests, messages (text), logins, satisfaction surveys, the renewal offer the tenant saw. | Whether a tenant is already looking for another flat. It knows a tenant's mood only from what their messages say. |\n| **Serwisownik** (maintenance ticketing system, CMMS) | Fault tickets, work orders for service companies, maintenance and inspections, technicians' notes (free text). | When a breakdown really started (a ticket is created when somebody calls). The “category” field is filled in carelessly — only 39% of lift breakdowns are categorised as “breakdown”. |\n| **Telemetra** (building IoT telemetry) | Lift controllers every 10 minutes: trips, doors, motor current, temperature, vibration, error codes. Heat substations and heat pumps every 15 minutes. | That something has broken — it only sees signals. It doesn't know the repair history or which parts were replaced. Vibration sensors only from 2024-05 (some lifts from 2025-01). |\n| **Radar Ofert** (investment department tool) | Sale listings from property portals and developer packages (asking price, description, photos), transactions from the property price register (with a lag of approx. 3 months), valuation reports for Domilo's units. | What a listing actually sold for, if the sale never reached the register. The listing description often contains the price — the system doesn't flag it. |\n| **“FinKs” ERP** (finance and accounting) | Repair and maintenance costs, retention discounts booked as rent reductions, tenant acquisition costs, the cost of valuation reports. | Which tenant a vacancy cost relates to — it only knows amounts per building and month. |\n| External data | OpenStreetMap (public transport stops, metro stations, parks, schools, shops), Statistics Poland (GUS) district statistics. | Nothing about any specific unit. |", "ludzie": [{"slug": "natalia-grabowska", "imie": "Natalia", "nazwisko": "Grabowska", "rola": "Data analyst, the company's only machine-learning specialist", "dzial": "Management Board – data team", "cytat": "I gathered all the lift tickets from Serwisownik and sorted them by category.", "cechy": ["attentive and curious about data", "builds all four data products", "speaks only in numbers she has computed herself"], "chce": "Models that someone actually uses.", "mowi": "In the first person, calmly, step by step (“I calculated…”, “I gathered…”); every number comes from the data.", "bio": "Natalia is a data analyst and the only machine-learning person at Domilo. She came from a fintech company, where she built credit scoring; here every department wants “AI”, yet nobody says what they will do with the output.\n\nShe builds all four products — the valuation, the leasing consultants' queue, the retention list and the lift alerts — and talks in the first person: “I calculated…”, “I gathered…”. She speaks only in numbers she has computed from the data herself.\n\nShe is attentive and curious, and at her best when she spots something odd in the data — a jump in door errors after a firmware update, or a CRM migration after which the source of enquiries changes.", "img": "img/natalia-grabowska.jpg"}, {"slug": "monika-lis", "imie": "Monika", "nazwisko": "Lis", "rola": "Chief Financial Officer (CFO)", "dzial": "Finance", "cytat": "We won't settle this dispute today. Let's agree instead on what we can: the order of the projects, the costs and access to data.", "cechy": ["analytical, asks for the number and where it comes from", "chairs Management Board meetings and closes disputes with a decision", "owns most of the company's economic assumptions", "keeps an eye on the bank and the covenant"], "chce": "A comfortable LTV covenant and costs she can defend.", "mowi": "Calm and matter-of-fact; brings order to the discussion (“Let's agree instead on what we can…”), talks in złoty amounts.", "bio": "Monika has been Domilo's CFO since 2020; before that she worked at a bank in commercial real-estate finance, so she knows the loan agreement with Nadwiślański Bank Hipoteczny from both sides of the table.\n\nShe watches two things: the LTV covenant and costs that can be defended in front of the Management Board. She pays PLN 3.24 m a year for external valuation reports, and from April 2026 the bank wants four times as many. In the accounts she also sees retention discounts growing — and no sign of the profit they are supposed to bring.\n\nShe owns most of the company's economic assumptions: the cost of a vacant day, the cost of a tenant leaving, the price of a valuation report. In meetings she brings order to the discussion and closes disputes with a decision: “We won't settle this dispute today. Let's agree instead on what we can.” She is the one who announces the order of the projects — valuation first, because the bank has set a deadline.", "img": "img/monika-lis.jpg"}, {"slug": "pawel-zielinski", "imie": "Paweł", "nazwisko": "Zieliński", "rola": "Investment Director", "dzial": "Investments", "cytat": "Radar shows forty-seven thousand listings a year. Ewa's team values eight a day per person. The rest we judge by eye — or not at all.", "cechy": ["decides fast and hates waiting", "thinks in terms of the market, not the portfolio", "wants a single number, not a range", "pushes hard, but accepts an argument backed by data"], "chce": "To buy cheap and fast, before a competitor snaps up the offer.", "mowi": "Short, firm sentences; opens with the problem (“My problem is simple…”); calls Natalia by her first name and makes demands (“Give me a model that values everything”).", "bio": "Paweł joined Domilo in 2018 from the investment department of a large developer, before the company had bought its first building in Wola. He negotiated most of the unit packages that make up today's portfolio, and he was the first to put Katowice in front of the Management Board.\n\nHe thinks in terms of the market, not the portfolio: in the morning he goes through Radar Ofert, in the afternoon he calls developers. He knows a good offer disappears within days, and that his team can properly review only one in six. That is why he wants a model that “values everything” — every listing, every unit, every day — and ideally a single number rather than a range.\n\nIn meetings he pushes and can be impatient, but he accepts an argument backed by data. When Ewa says that a figure for Katowice with no transactions is guesswork, he doesn't take offence — he asks for a rule that says when the model should stay silent.", "img": "img/pawel-zielinski.jpg"}, {"slug": "ewa-kaminska", "imie": "Ewa", "nazwisko": "Kamińska", "rola": "Chief Valuer (team of 4)", "dzial": "Investments – valuations", "cytat": "A figure for Katowice without a single transaction is a guess with two decimal places. A precise format doesn't add knowledge.", "cechy": ["precise and sceptical of automation", "defends the right to answer “I don't know”", "accepts a model if she gets a queue of the hard cases", "insists that a justification is a sentence a person can read"], "chce": "To value the things where a human expert really makes a difference.", "mowi": "Calm, factual, with a punchline; sets conditions for the specification (“Put that in the dashboard specification”).", "bio": "Ewa has been a property valuer for more than twenty years; at Domilo she leads a four-person valuation team. She knows the Warsaw and Kraków flat markets from valuation reports she signed herself, and she doesn't trust numbers without a provenance.\n\nHer day is eight valuations, most of them “obvious”. Since April 2026 the bank has wanted the portfolio revalued every quarter — something the team cannot manage without automation. Ewa isn't resisting the model; she is defending the right to answer “I don't know”. She will accept automated valuation if the hard cases — a new city, an unusual unit, a loft, Stocznia — come to her with a one-sentence justification, not just a number.\n\nShe speaks calmly and briefly, and dictates her conditions straight into the specification. She is the one who reminds Paweł that a precise format doesn't add knowledge.", "img": "img/ewa-kaminska.jpg"}, {"slug": "rafal-dabrowski", "imie": "Rafał", "nazwisko": "Dąbrowski", "rola": "Leasing Team Manager (11 consultants)", "dzial": "Leasing sales", "cytat": "The consultants call the newest enquiry first. I know four out of five calls are a waste of time, but I don't know which ones.", "cechy": ["energetic, practical, a little impatient", "counts in contracts and consultant hours", "defends his people's autonomy", "wants a result on the team board, not a report"], "chce": "More signed contracts without new headcount.", "mowi": "Directly, starting from what he doesn't need (“Let me start with what I don't need: more people”).", "bio": "Rafał leads a team of eleven leasing consultants. He started out as a consultant in Warsaw himself and still remembers calling “newest first” — because that's what everyone did.\n\nHe wants more signed contracts without new headcount, and says so at every meeting before anyone can suggest hiring. He knows that four out of five first calls are a waste of time, but not which ones. Each consultant decides for themselves: they have their favourite enquiry sources and call the newest first.\n\nHe is energetic and practical, a little impatient. He counts in contracts and consultant hours; his yardstick is revenue from signed contracts per hour of the team's work. He defends his people's autonomy — which is why he agrees to a queue in which a consultant can skip an item, giving a reason.", "img": "img/rafal-dabrowski.jpg"}, {"slug": "kasia-nowak", "imie": "Kasia", "nazwisko": "Nowak", "rola": "Leasing Consultant, Warsaw", "dzial": "Leasing sales", "cytat": "Rafał, I know people the model doesn't. The model can't know that, but I do.", "cechy": ["kind, worn out by a long call list", "trusts what she knows about her clients", "accepts the queue if she can skip an item, giving a reason", "speaks for the front-line consultants"], "chce": "To know in the morning whom to call first — and why.", "mowi": "Simply and concretely, from the perspective of her own shift (“My shift starts in the morning”).", "bio": "Kasia has been a leasing consultant in Warsaw for three years. She starts her day with a list of around three thousand open enquiries, sorted only by date, and a headset round her neck.\n\nShe knows clients the model doesn't: the company that always pulls out at the last minute, the people who have already signed elsewhere. That is why she looks at the queue with caution — and why she came up with the skip rule: one click and one of four reasons. “I'll take this rule on myself, because I'm the one who'll be applying it.”\n\nAfter the rollout she says it plainly: the list is good, it mostly matches what she would have picked herself, and every enquiry comes with a one-sentence justification. She has stopped calling the newest first.", "img": "img/kasia-nowak.jpg"}, {"slug": "joanna-michalak", "imie": "Joanna", "nazwisko": "Michalak", "rola": "Director of Tenant Services and Retention", "dzial": "Tenant services", "cytat": "Marketing says retention is up six points. Monika says the discounts cost two million a year. Both numbers are true, and I don't know what to do with that.", "cechy": ["warm but firm", "stands up for tenants and for her discount budget", "wants to know how many tenants would have stayed without a discount", "opens meetings with how things work today"], "chce": "Fewer tenants leaving at the end of their contract.", "mowi": "Warmly, putting the facts in order (“Let me start with how it works today”); keeps coming back to one question until she gets an answer.", "bio": "Joanna has run tenant services and retention since the first buildings opened. Her people staff the building receptions and the “Mój Domilo” portal; they are the ones who field complaints after a lift breakdown and questions about renewing a contract.\n\nSince February 2024 she has run the discount policy: an external vendor scores each tenant's risk of leaving, and the 35% with the highest scores get a discount. Marketing reports higher retention, Finance reports two million złoty a year in discounts. Both figures are true, and Joanna doesn't know what to do with them.\n\nShe is warm but firm. She stands up for tenants and for her budget, and in meetings she keeps coming back to a single question until she gets an answer: how many of the tenants who got a discount would have stayed without it.", "img": "img/joanna-michalak.jpg"}, {"slug": "bartek-sowa", "imie": "Bartek", "nazwisko": "Sowa", "rola": "CRM and Campaigns Specialist", "dzial": "Tenant services – marketing", "cytat": "Monika, the tenants without an offer are a cost too. Some of them are persuadables who will simply leave without a discount.", "cechy": ["campaign enthusiast", "a little unsure when the numbers aren't on his side", "wants to shrink the control group", "a quick learner"], "chce": "A campaign whose result can be shown in złoty.", "mowi": "Lively, “let me start with the numbers”; asks follow-up questions (“So there are more renewals, and the campaign is still in the red?”).", "bio": "Bartek is responsible for CRM and campaigns in Joanna's department. He came from a marketing agency; he likes dashboards and charts, and most of all a campaign whose result can be shown in złoty.\n\nHe reports discounted renewals and is only now discovering that he doesn't know how many of them would have happened anyway. When the Q3 campaign comes out in the red despite more renewals, he asks again in disbelief — and learns quickly. He wants to shrink the control group, because to him every tenant in it is a lost offer; Monika and Natalia explain why that's a bad idea.\n\nHe speaks animatedly and starts with the numbers, sometimes too confidently.", "img": "img/bartek-sowa.jpg"}, {"slug": "marek-wojciechowski", "imie": "Marek", "nazwisko": "Wojciechowski", "rola": "Head of the Technical Department", "dzial": "Technical department (46 people)", "cytat": "A lift breakdown at six on a Friday evening means calls to reception, rent reductions and a surcharge for emergency service.", "cechy": ["a hands-on practitioner, tired of breakdowns", "signs off the cost of a breakdown and takes responsibility for it", "leaves the alarm threshold to people, not to a metric", "trusts Zbyszek"], "chce": "To plan repairs instead of firefighting.", "mowi": "Vividly and concretely, starting from a situation in a building (“In my buildings, the lift stops at six on a Friday evening”).", "bio": "Marek heads the 46-person technical department. Before that he spent years running building maintenance at a large housing cooperative; he knows buildings from the basement to the roof.\n\nHis nightmare is a lift breaking down at six on a Friday evening: calls to reception, rent reductions, a surcharge for emergency service. He orders extra inspections “just in case”, and the lifts still break down. He wants to plan repairs instead of firefighting.\n\nHe puts his name to the cost of a breakdown and explains what it is made of: the surcharge and the rent reductions are in FinKs and the PMS, the complaints are his own estimate. He leaves the alarm threshold to people, not to a metric — “and it'll be Zbyszek rather than me”.", "img": "img/marek-wojciechowski.jpg"}, {"slug": "zbigniew-kowalczyk", "imie": "Zbigniew", "nazwisko": "Kowalczyk", "rola": "Maintenance Technicians Coordinator, 22 years working with lifts", "dzial": "Technical department", "cytat": "The category is picked by someone in a hurry. I log a breakdown as an intervention, because that way I close the work order faster.", "cechy": ["wise and sceptical, with a half-smile", "knows every lift by the name of its building", "looks after the golden set and the cost of a visit", "counts the alarms his department will actually read"], "chce": "A system that doesn't bury him in false alarms.", "mowi": "Calmly, in his own way, without jargon; owns up to the shortcuts that spoil the data.", "bio": "Zbigniew Kowalczyk — “Zbyszek” to everyone — has worked with lifts for 22 years; at Domilo he coordinates the technicians of both external service companies. He knows every lift by the name of its building and by the sound of its doors.\n\nThe breakdown history lives in his notes in Serwisownik, not in the database: the ticket category is picked by someone in a hurry, and he himself logs a breakdown as an intervention, because that closes the work order faster. He admits this without embarrassment — and that is why he is the one who looks after the golden set of hand-labelled tickets.\n\nHe is sceptical of system alarms: “three pointless alarms a week and I stop reading them”. What matters most to him is how many alarms a week his department will actually read.", "img": "img/zbigniew-kowalczyk.jpg"}], "historia": [{"data": "2017", "zdarzenie": "Company founded"}, {"data": "2019-04", "zdarzenie": "First building, Warsaw Wola"}, {"data": "2021–2022", "zdarzenie": "Expansion into Kraków, Wrocław, Poznań and Gdańsk"}, {"data": "2023-01", "zdarzenie": "Three buildings in Łódź"}, {"data": "2023-03", "zdarzenie": "PMS migrated to “Kwatera”"}, {"data": "2023", "zdarzenie": "Housing prices rise by approx. 0.6% a month"}, {"data": "2024-02", "zdarzenie": "Retention policy: a PLN 1,800 discount for the 35% of tenants rated most “at risk”"}, {"data": "2024-05", "zdarzenie": "Vibration sensors installed in 96 lifts"}, {"data": "2024-07 – 2025-06", "zdarzenie": "Housing prices flat"}, {"data": "2024-09", "zdarzenie": "Kępa Park (Wrocław, 290 units, 5 lifts) and Stocznia Park (Gdańsk, 230 units, 6 lifts) open"}, {"data": "2025-01", "zdarzenie": "Vibration sensors in all 140 lifts"}, {"data": "2025-03-03 – 2025-04-13", "zdarzenie": "CRM migrated to “Lejek”: an external call centre calls every enquiry in turn, within 24 h"}, {"data": "2025-06", "zdarzenie": "Framework agreements with three employers (Altakom, Vistel, Medikar) for employee relocations"}, {"data": "2025-07 – 2026-03", "zdarzenie": "Randomised discount test: the controlling department requires the discount offer to be allocated 50/50 at random across all expiring contracts"}, {"data": "2025-07 →", "zdarzenie": "Housing prices rise by approx. 0.3% a month"}, {"data": "2025-11-17", "zdarzenie": "Firmware update for Liftar controllers: error code E07 split into E07 and E17"}, {"data": "2026-01", "zdarzenie": "The Management Board considers entering Katowice"}, {"data": "2026-04", "zdarzenie": "The bank requires quarterly revaluation; approval for an AVM from 2027-Q1 once its conditions are met"}, {"data": "2026-04 – 2026-09", "zdarzenie": "Retention policy returns (the old 35% rule)"}, {"data": "2026-06 →", "zdarzenie": "First Katowice listings in Radar Ofert; in 2026-08 a developer package, “Osiedle Szyb”, 180 units"}, {"data": "2026-07 – 2026-09", "zdarzenie": "Q3 retention campaign under the old rule, with a 20% random control group (a condition set by the controlling department after the test)"}, {"data": "2026-09", "zdarzenie": "Last control valuation: 300 units valued by an external valuer"}], "inicjatywy": [{"id": "B1", "nazwa": "Valuation", "wlasciciel": "pawel-zielinski", "cytat": "Radar shows forty-seven thousand listings a year. Ewa's team values eight a day per person. The rest we judge by eye — or not at all.", "kto": "Paweł Zieliński, dyrektor inwestycji", "opis": "A model that every night values the listings from Radar and the whole Domilo portfolio: a price with an uncertainty interval and an honest “I don’t know” where the data is not enough. Valuers get only the hard cases, and the bank gets a valuation every quarter.", "art": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Wycena lokalu z przedziałem\">\n<rect class=\"s\" x=\"0\" y=\"0\" width=\"320\" height=\"180\"/>\n<g class=\"k\" fill=\"none\" stroke-width=\"2\">\n<path d=\"M40 150 V70 L85 42 L130 70 V150 Z\"/><path d=\"M28 150 H300\"/>\n<rect x=\"56\" y=\"82\" width=\"18\" height=\"18\"/><rect x=\"96\" y=\"82\" width=\"18\" height=\"18\"/><rect x=\"56\" y=\"112\" width=\"18\" height=\"18\"/><rect x=\"96\" y=\"112\" width=\"18\" height=\"18\"/>\n<\/g>\n<rect class=\"w k\" x=\"160\" y=\"58\" width=\"132\" height=\"70\" rx=\"4\" stroke-width=\"2\"/>\n<rect class=\"a2\" x=\"178\" y=\"96\" width=\"96\" height=\"10\" rx=\"5\"/>\n<circle class=\"a\" cx=\"222\" cy=\"101\" r=\"8\"/>\n<path class=\"k\" d=\"M178 88 V114 M274 88 V114\" stroke-width=\"2\"/>\n<rect class=\"ink\" x=\"178\" y=\"70\" width=\"44\" height=\"6\" rx=\"3\"/><rect class=\"mute\" x=\"228\" y=\"70\" width=\"28\" height=\"6\" rx=\"3\"/>\n<g transform=\"translate(270 140)\"><rect class=\"w k\" x=\"-22\" y=\"-14\" width=\"44\" height=\"28\" rx=\"14\" stroke-width=\"2\"/><text class=\"t\" x=\"0\" y=\"5\" text-anchor=\"middle\">?<\/text><\/g>\n<\/svg>\n"}, {"id": "B2", "nazwa": "Lead Queue", "wlasciciel": "rafal-dabrowski", "cytat": "The consultants call the newest enquiry first. I know four out of five calls are a waste of time, but I don't know which ones.", "kto": "Rafał Dąbrowski, kierownik zespołu najmu", "opis": "The enquiry queue in the CRM ordered by value: first the people most likely to sign and stay longer, each with one sentence of reasoning for the consultant.", "art": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Kolejka zapytań według wartości\">\n<rect class=\"s\" x=\"0\" y=\"0\" width=\"320\" height=\"180\"/>\n<g class=\"k\" fill=\"none\" stroke-width=\"2\"><rect x=\"30\" y=\"58\" width=\"44\" height=\"64\" rx=\"8\"/><path d=\"M46 112 H58\"/><\/g> function md(src){const Ls=(src||'').split('\n');let o='',i=0;while(i<Ls.length){const l=Ls[i];
 const h=l.match(/^(#{2,4})\s+(.*)/);if(h){o+=`<h3>${inline(h[2].replace(/^\d+\.\s*/,''))}</h3>`;i++;continue}
 if(/^\|/.test(l)){let r=[];while(i<Ls.length&&/^\|/.test(Ls[i]))r.push(Ls[i++]);r=r.filter(x=>!/^\|[\s:|-]+\|?$/.test(x));
  o+='<div class="scroll"><table>'+r.map((x,k)=>'<tr>'+x.replace(/^\||\|$/g,'').split('|').map(c=>k?`<td>${inline(c.trim())}</td>`:`<th>${inline(c.trim())}</th>`).join('')+'</tr>').join('')+'</table></div>';continue}
 if(/^\s*[-*]\s+/.test(l)){let b=[];while(i<Ls.length&&/^\s*[-*]\s+/.test(Ls[i]))b.push(Ls[i++].replace(/^\s*[-*]\s+/,''));o+='<ul>'+b.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>';continue}
 if(/^>/.test(l)){let b=[];while(i<Ls.length&&/^>/.test(Ls[i]))b.push(Ls[i++].replace(/^>\s?/,''));o+=`<blockquote>${b.map(inline).join('<br>')}</blockquote>`;continue}
 if(!l.trim()||/^---+$/.test(l.trim())){i++;continue}
 let b=[];while(i<Ls.length&&Ls[i].trim()&&!/^(#|\||>|\s*[-*]\s|---)/.test(Ls[i]))b.push(Ls[i++]);o+=`<p>${inline(b.join(' '))}</p>`}
 return `<div class="md">${o}</div>`}
