[project]
name = "ai-2030-g3-domilo"
version = "0.1.0"
description = "Domilo S.A.: cztery modele predykcyjne (kurs „Zostań praktykiem modeli predykcyjnych”)"
authors = [
    {name = "IMPRV.ai Dev Team",email = "dev@imprv.ai"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["duckdb (>=2.0.0,<3.0.0)", "pandas (>=3.1.1,<4.0.0)", "pyarrow (>=26.0.1,<27.0.0)", "scikit-learn (>=1.9.1,<2.0.0)", "lightgbm (>=4.7.0,<5.0.0)", "pytz (>=2026.6,<2027.0)", "mlflow (>=3.18.0,<4.0.0)", "openai (>=2,<3)", "fastapi (>=0.163.1,<0.164.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "inngest (>=0.5.20,<0.6.0)", "autograd (>=1.5)", "autograd-gamma (>=0.3)", "formulaic (>=0.2.2)", "causalml (>=0.18.0,<0.19.0)", "tsfresh (>=0.21.2,<0.22.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pypyr = "^5.9.1"
pre-commit = "^4.6.0"
black = "*"
isort = "*"
flake8 = "*"
pytest = "*"
pytest-cov = "*"
jupyter = "^1.1.1"
dbt-duckdb = "^1.11.1"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

# ---------------------------------------------------------------------------
# pypyr: `pypyr <nazwa>` uruchamia pipeline z dev/. Uruchamiaj z katalogu głównego repozytorium.
# Zmienne poniżej trafiają do pipeline'ów jako {nazwa} (krok pypyr.steps.configvars).
# ---------------------------------------------------------------------------
[tool.pypyr.vars]
src_dir = "api/api"
test_dir = "api/tests"
python_target_version = "py312"
max_line_length = "120"
min_coverage = "0"
linter_ignore_errors = "D100,D101,D102,D103,D104,D105,D106,D107,E203,E231,W503,N806,E704"
linter_exclude = ".venv,migrations"

[tool.pypyr.shortcuts]
install = { pipeline_name = "dev/install" }
format = { pipeline_name = "dev/format" }
check_format = { pipeline_name = "dev/check_format" }
lint = { pipeline_name = "dev/lint" }
test = { pipeline_name = "dev/test" }
precommit = { pipeline_name = "dev/precommit" }
baza = { pipeline_name = "dev/baza" }
api = { pipeline_name = "dev/api" }
nocne = { pipeline_name = "dev/nocne" }
kolejka = { pipeline_name = "dev/kolejka" }
kolejka_wstecz = { pipeline_name = "dev/kolejka_wstecz" }
mock_lejek = { pipeline_name = "dev/mock_lejek" }
lista_retencyjna = { pipeline_name = "dev/lista_retencyjna" }
metabase = { pipeline_name = "dev/metabase" }
serwisownik_mock = { pipeline_name = "dev/serwisownik_mock" }
telemetra_okna = { pipeline_name = "dev/telemetra_okna" }
ryzyko_wind = { pipeline_name = "dev/ryzyko_wind" }
ryzyko_wind_wstecz = { pipeline_name = "dev/ryzyko_wind_wstecz" }
grafana = { pipeline_name = "dev/grafana" }

[tool.pytest.ini_options]
pythonpath = ["api"]
