steps:
  - name: pypyr.steps.cmd
    description: Budowa domilo.duckdb z plików Parquet w data/ (data/ tylko do odczytu)
    in:
      cmd:
        run: poetry run python -m api.adapters.duckdb_baza
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela leady_cel (target kolejki zapytań, api/api/ai/features/leady/leady_cel.sql)
    in:
      cmd:
        run: poetry run python -m api.ai.features.leady.leady_cel
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela migawki_najemcy (target listy retencyjnej, api/api/ai/features/najemcy/migawki.sql)
    in:
      cmd:
        run: poetry run python -m api.ai.features.najemcy.migawki
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela cechy_najemcy (cechy na dzień migawki, api/api/ai/features/najemcy/sql/*.sql)
    in:
      cmd:
        run: poetry run python -m api.ai.features.najemcy.cechy
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela czas_najmu (najem roczny, czas w miesiącach i cenzura; api/api/ai/features/najemcy/czas_najmu.sql)
    in:
      cmd:
        run: poetry run python -m api.ai.features.najemcy.czas_najmu
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela zgloszenia_wind (zgłoszenia Serwisownika dotyczące wind; api/api/ai/features/windy/zgloszenia_wind.sql)
    in:
      cmd:
        run: poetry run python -m api.ai.features.windy.zgloszenia_wind
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela awarie_odtworzone (LLM z notatek + start z telemetrii; pomijana bez features/windy/awarie_llm/awaria_v1_windy.parquet)
    in:
      cmd:
        run: poetry run python -m api.ai.features.windy.awarie_odtworzone
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela dni_wind (target awaria_7d, winda × dzień; api/api/ai/features/windy/dni_wind.sql; pomijana bez awarie_odtworzone)
    in:
      cmd:
        run: poetry run python -m api.ai.features.windy.dni_wind
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela cechy_windy (cechy z telemetrii na 05:50 dnia oceny; api/api/ai/features/windy/sql/*.sql, cechy.py; pomijana bez dni_wind)
    in:
      cmd:
        run: poetry run python -m api.ai.features.windy.cechy
        cwd: api
  - name: pypyr.steps.cmd
    description: Modele dbt metryk (schemat metryki; api/api/data_platform/dbt, docs/kolejka_metryki.md) z testami
    in:
      cmd:
        run: poetry run python -m api.data_platform.dbt_uruchom build
        cwd: api
