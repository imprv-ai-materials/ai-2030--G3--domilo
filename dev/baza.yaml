steps:
  - name: pypyr.steps.cmd
    description: Budowa domilo.duckdb z plików Parquet w data/ (data/ tylko do odczytu)
    in:
      cmd:
        run: poetry run python -m api.adapters.duckdb_baza
        cwd: api
  - name: pypyr.steps.cmd
    description: Tabela leady_cel (target kolejki zapytań, api/api/ai/features/leady/leady_cel.sql)
    in:
      cmd:
        run: poetry run python -m api.ai.features.leady.leady_cel
        cwd: api
