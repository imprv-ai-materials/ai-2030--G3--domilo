context_parser: pypyr.parser.keyvaluepairs
steps:
  - pypyr.steps.debug
  - pypyr.steps.configvars

  - name: pypyr.steps.shell
    description: Instalacja zależności Pythona
    in:
      cmd: poetry install

  - name: pypyr.steps.shell
    description: lifelines bez zależności (0.30.3 deklaruje pandas < 3, projekt ma pandas 3.1; reszta zależności w pyproject)
    in:
      cmd: poetry run pip install --no-deps "lifelines==0.30.3"

  - name: pypyr.steps.cmd
    description: Instalacja hooków pre-commit
    swallow: true
    in:
      cmd: poetry run pre-commit install

  - name: pypyr.steps.shell
    description: Instalacja zależności panelu (tylko gdy jest ui/package.json)
    in:
      cmd: if [ -f ui/package.json ]; then pnpm --dir ui install; else echo "ui/ jeszcze nie ma - pomijam pnpm install"; fi
