# Lokalne hooki: te same narzędzia co pipeline'y pypyr w dev/, przez poetry.
# `pypyr precommit` uruchamia je na wszystkich plikach; `pypyr install` instaluje je jako hook gita.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black -l 120 -t py312
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: poetry run flake8 --max-line-length=120 --extend-ignore=D100,D101,D102,D103,D104,D105,D106,D107,E203,E231,W503,N806,E704
        language: system
        types: [python]
