# Podzespoły windy w alertach o ryzyku awarii (maintenance_bc/wyjasnienie.py; docs/b4_ryzyko_dzienne.md).
#
# Lista podejrzanych podzespołów = suma wkładów SHAP (explain aktywnej wersji, dzień alarmu) wszystkich cech
# przypisanych do podzespołu w sekcji `cechy`; na liście są podzespoły z sumą > 0, od największej.
# Opis alertu: pierwszy podzespół, jego 2 sygnały o największym wkładzie (sekcja `sygnaly`: nazwa w zdaniu, sposób
# opisu wartości) i `sprawdz` (co obejrzeć).
#
# Co jest czym (stan 2026-11-16):
# - `cechy` (cecha -> podzespół; null = cecha kontekstu: użycie windy, temperatura maszynowni, obecność czujnika):
#   ZAŁOŻENIE tej pracy według tego, co mierzy sygnał (features/windy/katalog.yaml). Dwa sygnały niejednoznaczne
#   (naped_blad_poziomowania, wibracje_rms) przypisano do hamulec_liny regułą ustaloną przed oceną na teście:
#   wariant o najwyższym trafieniu 1. podzespołu na WALIDACJI 2025-07 – 2025-12 (966 dni z awarią; warianty:
#   poziomowanie / wibracje -> hamulec_liny / hamulec_liny 75,8%, hamulec_liny / naped 75,6%, naped / naped 69,1%,
#   naped / hamulec_liny 69,1%; failure_model/evals/podzespoly.py --wybor).
# - `podzespoly.*.sprawdz` i `sygnaly.*.nazwa`: teksty dla technika zaproponowane w tej pracy (dla drzwi: przykład
#   użytkownika z 2026-11-16 „Sprawdź operator drzwi i rolki”); do potwierdzenia przez kierownika działu technicznego.
# Spójność z modelem i katalogiem cech: api/tests/test_ryzyko_dzienne_wind.py.

podzespoly:
  drzwi: {nazwa: Drzwi, sprawdz: "operator drzwi i rolki"}
  naped: {nazwa: Napęd, sprawdz: "silnik, przekładnię i łożyska napędu"}
  hamulec_liny: {nazwa: Hamulec i liny, sprawdz: "hamulec, liny i prowadnice kabiny"}
  sterownik: {nazwa: Sterownik, sprawdz: "sterownik i wersję jego oprogramowania"}

# sygnał -> nazwa w zdaniu i sposób opisu wartości z dnia oceny:
#   stosunek  = średnia z okna / norma z 30 dni (dni 15–44 przed oceną): „+38%” albo „3×”;
#   roznica   = średnia z okna − norma (°C): „+6 °C”;
#   liczba    = suma w ostatniej dobie (gdy norma = 0 albo brak): „12 w ostatniej dobie”;
#   firmware  = dni od zmiany oprogramowania.
sygnaly:
  drzwi_ponowne_otwarcia: {nazwa: ponowne otwarcia, opis: stosunek}
  drzwi_czas_zamykania_sr: {nazwa: czas zamykania, opis: stosunek}
  drzwi_czas_zamykania_max: {nazwa: najdłuższy czas zamykania, opis: stosunek}
  drzwi_bledy: {nazwa: błędy drzwi, opis: stosunek}
  naped_prad_sr: {nazwa: prąd silnika, opis: stosunek}
  naped_prad_max: {nazwa: szczytowy prąd silnika, opis: stosunek}
  naped_temp_silnika: {nazwa: temperatura silnika, opis: roznica}
  naped_temp_maszynowni: {nazwa: temperatura maszynowni, opis: roznica}
  naped_blad_poziomowania: {nazwa: błąd poziomowania kabiny, opis: stosunek}
  naped_bledy: {nazwa: błędy napędu, opis: stosunek}
  wibracje_rms: {nazwa: drgania kabiny, opis: stosunek}
  wibracje_czujnik: {nazwa: czujnik drgań, opis: brak}
  sterownik_bledy: {nazwa: błędy sterownika, opis: stosunek}
  sterownik_firmware: {nazwa: oprogramowanie sterownika, opis: firmware}
  uzycie_kursy: {nazwa: liczba kursów, opis: stosunek}
  uzycie_otwarcia_drzwi: {nazwa: otwarcia drzwi, opis: stosunek}
  uzycie_wylaczona: {nazwa: czas wyłączenia, opis: stosunek}

