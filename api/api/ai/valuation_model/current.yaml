# Wersja modelu wyceny używana obecnie (katalog w versions/).
wersja: v4_llm_cechy
model: versions/v4_llm_cechy/model.joblib
klasa: api.ai.valuation_model.versions.v4_llm_cechy.model.ModelWycenyV4
ustalono: 2026-11-15
regula_wyboru: >
  Ustalona przed uczeniem v4 (docs/b1_v4_llm_cechy.md): v4 trafia tu, jeśli MAPE jej P50 (bez odmów) na 300 operatach
  kontrolnych jest niższe niż MAPE wersji stąd (v1_liniowa) na tych samych 300 lokalach.
uzasadnienie: >
  300 operatów kontrolnych (2026-09, lokale Domilo): v4 P50 MAPE 5,40% (z odmowami 5,39%, odmowy 1,0%),
  v1_liniowa 7,14%, v3_przedzialy 5,90%, baseline v0 13,39%. Różnica v4 − v1: −1,74 pp (bootstrap par, 95% CI
  −2,22 … −1,29); v4 − v2_lgbm_geo: −0,50 pp (CI −0,75 … −0,23). Pokrycie przedziału 80% na operatach 79,0%
  (norma banku 77–83%). Test RCN (7 487): v4 MAPE 8,30% / z odmowami 8,28%, v3 8,50%, v1 10,17%; testowe
  dopasowania (2 882): v4 8,26%, v2_lgbm_geo 8,97% (evals/porownanie.md, docs/b1_v4_llm_cechy.md).
ograniczenia: >
  Wymaga cech z LLM (gpt-6-luna, prompt cechy_lokalu_v1) dla każdego wycenianego lokalu: opis bez kwot
  (ceny_w_opisie.bez_kwot) -> features/wycena/cechy_llm/*.parquet; nowy lokal = nowe wywołanie LLM.
  Opisy Domilo różnią się od ogłoszeń: brak standardu 1–2, widok zawsze brak_info, lokale bez balkonu dostają
  brak_info zamiast „nie” (docs/b1_v4_llm_cechy.md, tabela 2). Na testowych dopasowaniach pokrycie przedziału
  76,4% (poniżej 77%); na całym teście 77,8%. Zaniża wycenę (mediana błędu na operatach −2,8%, na teście −4,3%).
  Standard ze zdjęć pogarsza wynik i nie jest używany. Poza znanymi miastami odmowa (detektor v3, Katowice 100%).
poprzednia: >
  v1_liniowa (do 2026-11-15): test MAPE 10,2% / MdAPE 8,3%, operaty kontrolne 7,14%; bez przedziału i bez odmowy.
sprawdzone_niewybrane: >
  v2_lightgbm (2026-11-15): LightGBM na cechach v1, test MAPE 10,2% (bez poprawy względem v1).
  v3_przedzialy (2026-11-15, docs/b1_v3.md): operaty kontrolne MAPE 5,90%, test 8,50% na przyjętych; v4 jest
  lepsza na operatach i na teście (bootstrap powyżej).
